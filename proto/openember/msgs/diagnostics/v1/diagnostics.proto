syntax = "proto3";

package openember.msgs.diagnostics.v1;

import "openember/msgs/common/v1/common.proto";

option cc_enable_arenas = true;
option go_package = "github.com/openember/openember-msgs/gen/go/openember/msgs/diagnostics/v1;diagnosticsv1";
option java_multiple_files = true;
option java_package = "org.openember.msgs.diagnostics.v1";

enum DiagnosticLevel {
  DIAGNOSTIC_LEVEL_UNSPECIFIED = 0;
  DIAGNOSTIC_LEVEL_OK = 1;
  DIAGNOSTIC_LEVEL_WARNING = 2;
  DIAGNOSTIC_LEVEL_ERROR = 3;
  DIAGNOSTIC_LEVEL_STALE = 4;
}

message DiagnosticStatus {
  openember.msgs.common.v1.Header header = 1;
  string name = 2;
  string node_name = 3;
  string hardware_id = 4;
  DiagnosticLevel level = 5;
  string message = 6;
  repeated openember.msgs.common.v1.KeyValue values = 7;
  repeated openember.msgs.common.v1.Metric metrics = 8;
}

message DiagnosticArray {
  openember.msgs.common.v1.Header header = 1;
  repeated DiagnosticStatus status = 2;
}
