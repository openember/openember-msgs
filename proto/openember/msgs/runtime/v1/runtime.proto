syntax = "proto3";

package openember.msgs.runtime.v1;

import "openember/msgs/common/v1/common.proto";

option cc_enable_arenas = true;
option go_package = "github.com/openember/openember-msgs/gen/go/openember/msgs/runtime/v1;runtimev1";
option java_multiple_files = true;
option java_package = "org.openember.msgs.runtime.v1";

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_STARTING = 1;
  PROCESS_STATE_RUNNING = 2;
  PROCESS_STATE_STOPPING = 3;
  PROCESS_STATE_STOPPED = 4;
  PROCESS_STATE_EXITED = 5;
  PROCESS_STATE_FAILED = 6;
}

message ProcessSpec {
  string name = 1;
  string executable = 2;
  repeated string args = 3;
  repeated openember.msgs.common.v1.KeyValue env = 4;
  string working_directory = 5;
  bool restart_on_failure = 6;
  uint32 restart_limit = 7;
}

message ProcessInfo {
  string name = 1;
  uint32 process_id = 2;
  ProcessState state = 3;
  int32 exit_code = 4;
  uint64 start_time_unix_ns = 5;
  uint64 stop_time_unix_ns = 6;
  string message = 7;
  bool ready = 8; // Interpreted using readiness_notify; otherwise only means spawned.
  bool desired_running = 9;
  repeated string depends_on = 10;
  uint32 restart_count = 11; // Automatic restart attempts scheduled in this manager session.
  string restart_policy = 12;
  uint32 restart_limit = 13;
  bool readiness_notify = 14;
  uint64 heartbeat_timeout_ms = 15; // Zero disables heartbeat supervision.
  bool heartbeat_received = 16;
  uint64 heartbeat_age_ms = 17; // Meaningful only when heartbeat_received is true.
}

message StartProcessRequest {
  openember.msgs.common.v1.Header header = 1;
  ProcessSpec process = 2;
}

message StartProcessResponse {
  openember.msgs.common.v1.Header header = 1;
  openember.msgs.common.v1.Status status = 2;
  ProcessInfo process = 3;
}

message StopProcessRequest {
  openember.msgs.common.v1.Header header = 1;
  string name = 2;
  uint32 process_id = 3;
  uint64 timeout_ms = 4;
}

message StopProcessResponse {
  openember.msgs.common.v1.Header header = 1;
  openember.msgs.common.v1.Status status = 2;
  ProcessInfo process = 3;
}

message ProcessEvent {
  openember.msgs.common.v1.Header header = 1;
  ProcessInfo process = 2;
}

// Complete replacement snapshot, periodically published on /runtime/process/state.
// Includes configured processes even when waiting for dependencies or already exited.
// No command arguments or environment values are exposed.
message ProcessStateSnapshot {
  openember.msgs.common.v1.Header header = 1;
  string manager_session = 2;
  uint32 manager_process_id = 3;
  bool online = 4;
  uint32 stale_after_ms = 5;
  repeated ProcessInfo processes = 6;
}
