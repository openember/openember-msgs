syntax = "proto3";

package openember.msgs.sensor.v1;

import "openember/msgs/common/v1/common.proto";

option cc_enable_arenas = true;
option go_package = "github.com/openember/openember-msgs/gen/go/openember/msgs/sensor/v1;sensorv1";
option java_multiple_files = true;
option java_package = "org.openember.msgs.sensor.v1";

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// Named components; never infer array order. Zero is NOT identity.
message Quaternion {
  double w = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

enum SensorType {
  SENSOR_TYPE_UNSPECIFIED = 0;
  SENSOR_TYPE_IMU = 1;
  SENSOR_TYPE_TEMPERATURE = 2;
  SENSOR_TYPE_GNSS = 3;
  SENSOR_TYPE_CAMERA = 4;
  SENSOR_TYPE_LIDAR = 5;
}

enum SensorAvailability {
  SENSOR_AVAILABILITY_UNSPECIFIED = 0;
  SENSOR_AVAILABILITY_OFFLINE = 1;
  SENSOR_AVAILABILITY_ONLINE = 2;
  SENSOR_AVAILABILITY_DEGRADED = 3;
  SENSOR_AVAILABILITY_ERROR = 4;
}

enum GnssFixType {
  GNSS_FIX_TYPE_UNSPECIFIED = 0;
  GNSS_FIX_TYPE_NO_FIX = 1;
  GNSS_FIX_TYPE_FIX_2D = 2;
  GNSS_FIX_TYPE_FIX_3D = 3;
  GNSS_FIX_TYPE_RTK_FLOAT = 4;
  GNSS_FIX_TYPE_RTK_FIXED = 5;
}

enum AltitudeReference {
  ALTITUDE_REFERENCE_UNSPECIFIED = 0;
  ALTITUDE_REFERENCE_WGS84_ELLIPSOID = 1;
  ALTITUDE_REFERENCE_MEAN_SEA_LEVEL = 2;
}

enum CovarianceType {
  COVARIANCE_TYPE_UNSPECIFIED = 0;
  COVARIANCE_TYPE_APPROXIMATED = 1;
  COVARIANCE_TYPE_DIAGONAL = 2;
  COVARIANCE_TYPE_FULL = 3;
}

message ImuSample {
  openember.msgs.common.v1.Header header = 1;
  string sensor_id = 2;
  string frame_id = 3;
  uint64 sample_time_monotonic_ns = 4;
  uint64 sequence = 5;
  Vector3 acceleration_mps2 = 6;
  Vector3 angular_velocity_radps = 7;
  Vector3 magnetic_field_tesla = 8;
  double temperature_celsius = 9;
  // Unit quaternion R_reference_sensor: v_reference = R(q) * v_sensor.
  // Describes frame_id relative to reference_frame_id. No implicit ENU/NED or
  // mounting transform. Consumers must validate finite components and norm.
  Quaternion orientation = 10;
  bool orientation_valid = 11;
  string reference_frame_id = 12;
  // Unique producer boot/acquisition session for receive_time_monotonic_ns.
  // Restart/reconnect with sequence reset requires a NEW clock_domain.
  string clock_domain = 13;
  string mounting_revision = 14;
  // Host receive time of the ORIGINAL sample, not publication/replay time.
  // Compare only within clock_domain. Field 4 keeps its legacy meaning;
  // device sample clocks must not be compared to this receive clock implicitly.
  uint64 receive_time_monotonic_ns = 15;
  // False means unavailable/invalid, including legacy messages lacking these
  // fields. Numeric zero alone is never evidence of a valid measurement.
  // A valid vector/orientation also requires its message to be present.
  bool acceleration_valid = 16;
  bool angular_velocity_valid = 17;
  bool magnetic_field_valid = 18;
  bool temperature_valid = 19;
}

message TemperatureSample {
  openember.msgs.common.v1.Header header = 1;
  string sensor_id = 2;
  string frame_id = 3;
  uint64 sample_time_monotonic_ns = 4;
  uint64 sequence = 5;
  double temperature_celsius = 6;
}

// Generic scalar reading for humidity, illuminance, soil moisture, CO2, etc.
message ScalarSample {
  openember.msgs.common.v1.Header header = 1;
  string sensor_id = 2;
  string frame_id = 3;
  uint64 sample_time_monotonic_ns = 4;
  uint64 sequence = 5;
  string quantity = 6;
  double value = 7;
  string unit = 8;
}

message GnssFix {
  openember.msgs.common.v1.Header header = 1;
  string sensor_id = 2;
  string frame_id = 3;
  uint64 sample_time_monotonic_ns = 4;
  uint64 sequence = 5;
  GnssFixType fix_type = 6;
  double latitude_deg = 7;
  double longitude_deg = 8;
  double altitude_m = 9;
  Vector3 velocity_enu_mps = 10;
  uint32 satellites_used = 11;
  double horizontal_accuracy_m = 12;
  double vertical_accuracy_m = 13;
  // WGS84 latitude/longitude; frame_id identifies the antenna measurement point.
  // No fix, unspecified fix, or false validity must not yield a usable position.
  bool position_valid = 14;
  bool altitude_valid = 15;
  bool velocity_valid = 16;
  bool satellites_used_valid = 17;
  // When valid: horizontal sqrt(varE + varN), vertical sqrt(varU), in metres.
  // Do not substitute HDOP, CEP or an unconverted confidence interval.
  bool horizontal_accuracy_valid = 18;
  bool vertical_accuracy_valid = 19;
  // Legacy altitude_m has no implicit datum. Unknown is not ellipsoid height.
  AltitudeReference altitude_reference = 20;
  // Original host receive clock/session, as for ImuSample. Not replay time.
  string clock_domain = 21;
  uint64 receive_time_monotonic_ns = 22;
  // Metres squared, ENU tangent plane, row-major 3x3. Empty when unknown.
  repeated double position_covariance_m2 = 23;
  CovarianceType position_covariance_type = 24;
  // Domain for legacy field 4, independent of the host receive clock.
  string sample_clock_domain = 25;
  // Optional acquisition UTC; zero means unknown. Not header publication time.
  uint64 sample_time_unix_ns = 26;
}

message SensorStatus {
  openember.msgs.common.v1.Header header = 1;
  string sensor_id = 2;
  SensorType type = 3;
  SensorAvailability availability = 4;
  openember.msgs.common.v1.HealthState health = 5;
  string message = 6;
  repeated openember.msgs.common.v1.Metric metrics = 7;
}
