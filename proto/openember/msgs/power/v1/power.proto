syntax = "proto3";

package openember.msgs.power.v1;

import "openember/msgs/common/v1/common.proto";

option cc_enable_arenas = true;
option go_package = "github.com/openember/openember-msgs/gen/go/openember/msgs/power/v1;powerv1";
option java_multiple_files = true;
option java_package = "org.openember.msgs.power.v1";

enum PowerAvailability {
  POWER_AVAILABILITY_UNSPECIFIED = 0;
  POWER_AVAILABILITY_OFFLINE = 1;
  POWER_AVAILABILITY_ONLINE = 2;
  POWER_AVAILABILITY_DEGRADED = 3;
  POWER_AVAILABILITY_FAULT = 4;
}

message BatteryState {
  openember.msgs.common.v1.Header header = 1;
  string battery_id = 2;
  uint64 sample_time_monotonic_ns = 3;
  uint64 sequence = 4;
  double voltage_v = 5;
  double current_a = 6;
  double temperature_celsius = 7;
  double state_of_charge_percent = 8;
  PowerAvailability availability = 9;
  // Field validity is independent of receipt freshness. Old senders default to
  // unknown/invalid; zero is a legitimate measurement, not a missing sentinel.
  bool voltage_valid = 10;
  bool current_valid = 11;
  bool temperature_valid = 12;
  bool state_of_charge_valid = 13;
  bool connected_known = 14;
  bool connected = 15;
  // Host receipt, not downstream BMS sampling time. Compare monotonic values
  // only within the advertised source clock/session domain.
  uint64 receive_time_monotonic_ns = 16;
  string clock_domain = 17;
  bool receive_fresh = 18;
}

message PowerState {
  openember.msgs.common.v1.Header header = 1;
  string power_id = 2;
  uint64 sample_time_monotonic_ns = 3;
  uint64 sequence = 4;
  PowerAvailability availability = 5;
  string message = 6;
  repeated openember.msgs.common.v1.Metric metrics = 7;
  uint64 receive_time_monotonic_ns = 8;
  string clock_domain = 9;
  // Receipt freshness does not guarantee downstream measurement freshness.
  bool receive_fresh = 10;
}

message PowerCommand {
  openember.msgs.common.v1.Header header = 1;
  string power_id = 2;
  uint64 command_time_monotonic_ns = 3;
  uint64 sequence = 4;
  string command = 5;
  repeated openember.msgs.common.v1.KeyValue parameters = 6;
}
