syntax = "proto3";

package openember.msgs.common.v1;

option cc_enable_arenas = true;
option go_package = "github.com/openember/openember-msgs/gen/go/openember/msgs/common/v1;commonv1";
option java_multiple_files = true;
option java_package = "org.openember.msgs.common.v1";

message Header {
  string source_node = 1;
  string source_instance = 2;
  string robot_id = 3;
  string namespace_name = 4;
  uint64 sequence = 5;
  uint64 timestamp_unix_ns = 6;
  string trace_id = 7;
  string request_id = 8;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message Version {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
  string label = 4;
}

message Status {
  int32 code = 1;
  string message = 2;
  repeated KeyValue details = 3;
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_OK = 1;
  HEALTH_STATE_WARNING = 2;
  HEALTH_STATE_ERROR = 3;
  HEALTH_STATE_STALE = 4;
}

enum Reliability {
  RELIABILITY_UNSPECIFIED = 0;
  RELIABILITY_BEST_EFFORT = 1;
  RELIABILITY_RELIABLE = 2;
}

enum Durability {
  DURABILITY_UNSPECIFIED = 0;
  DURABILITY_VOLATILE = 1;
  DURABILITY_TRANSIENT_LOCAL = 2;
}

message QosProfile {
  uint32 queue_size = 1;
  Reliability reliability = 2;
  Durability durability = 3;
  uint32 deadline_ms = 4;
  uint32 lifespan_ms = 5;
}

message Metric {
  string name = 1;
  double value = 2;
  string unit = 3;
  repeated KeyValue labels = 4;
}

// Generic stamped boolean (e.g. e-stop engaged).
message BoolStamped {
  Header header = 1;
  bool value = 2;
}
